name: Public-data pyaging project demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-public-example:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_NO_CACHE_DIR: "1"
      PYAGING_DATA_REVISION: v0.3.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU research dependency
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyaging==0.5.2
      - name: Run public NHANES example only
        run: python automation/projects/pyaging_public_demo.py
      - name: Verify summary has no per-person records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('automation/runs/pyaging-public-demo/summary.json').read_text())
          assert data['sample_count'] == 30
          assert sorted(data['clock_results']) == ['homeostaticdysregulation', 'kdmage', 'phenoage']
          assert 'NHANES_' not in json.dumps(data)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pyaging-public-summary-${{ github.run_id }}
          path: automation/runs/pyaging-public-demo/summary.json
          retention-days: 7
