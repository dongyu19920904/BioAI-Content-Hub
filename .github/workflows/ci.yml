name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "Check public repository preflight safety and idempotency"
        run: node --test automation/services/repo-preflight.test.mjs

      - name: "Check no-login browser repository preflight"
        run: node --test src/scripts/repoQuickCheck.test.mjs

      - name: "Check automatic open-source project discovery"
        run: node --test automation/projects/discover-open-source.test.mjs

      - name: "Check Biolearn public-run aggregate boundary"
        run: python3 -m unittest discover -s automation/projects -p 'test_biolearn_public_demo.py'

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🚀 Build the project"
        run: pnpm run build
