name: Verify public project page and video link

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "13 3 * * 1" # Weekly; GitHub schedules may drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-project:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch the real public page and its video asset
        shell: bash
        run: |
          set -euo pipefail
          page='https://life.aivora.cn/projects/pyaging-public-demo/'
          scageclock_page='https://life.aivora.cn/projects/scageclock-public-demo/'
          biolearn_page='https://life.aivora.cn/projects/biolearn-public-demo/'
          guide_page='https://life.aivora.cn/posts/pyaging-public-data-reproduction-guide/'
          scageclock_guide='https://life.aivora.cn/posts/scageclock-public-sample-reproduction-guide/'
          choice_page='https://life.aivora.cn/posts/pyaging-vs-scageclock-input-choice/'
          service_page='https://life.aivora.cn/services/repo-preflight/'
          tools_page='https://life.aivora.cn/projects/open-source-tools/'
          stats_page='https://life.aivora.cn/stats/'
          video='https://github.com/dongyu19920904/BioAI-Content-Hub/releases/download/pyaging-public-video-v1/pyaging-public-demo-zh.mp4'
          scageclock_video='https://github.com/dongyu19920904/BioAI-Content-Hub/releases/download/scageclock-public-video-v1/scageclock-public-demo-zh.mp4'
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 "$page" --output page.html
          grep -Fq 'pyaging-public-video-v1' page.html
          grep -Fq '下载中文演示视频' page.html
          grep -Fq '/posts/pyaging-public-data-reproduction-guide/' page.html
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 "$guide_page" --output guide-page.html
          grep -Fq 'pyaging 生物年龄时钟公开样本实测与复现指南' guide-page.html
          grep -Fq '36233207115' guide-page.html
          grep -Fq 'v0.5.1' guide-page.html
          grep -Fq 'Fork' guide-page.html
          grep -Fq 'article-reproduction-feedback.md' guide-page.html
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 "$scageclock_guide" --output scageclock-guide.html
          grep -Fq 'scAgeClock 单细胞时钟公开样本复现' scageclock-guide.html
          grep -Fq '36552059091' scageclock-guide.html
          grep -Fq '不是独立测试集' scageclock-guide.html
          grep -Fq 'upstream_commit' scageclock-guide.html
          grep -Fq 'article-reproduction-feedback.md' scageclock-guide.html
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 "$choice_page" --output choice-page.html
          grep -Fq '血液化学数据还是单细胞数据' choice-page.html
          grep -Fq '36379154517' choice-page.html
          grep -Fq '/services/repo-preflight/' choice-page.html
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 "$service_page" --output service-page.html
          grep -Fq '想试一个生命科学开源工具' service-page.html
          grep -Fq 'id="repo-quick-check"' service-page.html
          grep -Fq '先在本页免费查一次，无需登录' service-page.html
          grep -Fq 'repo-preflight.astro_astro_type_script' service-page.html
          grep -Fq 'open-source-repo-preflight.yml' service-page.html
          grep -Fq '没有下载或运行' service-page.html || grep -Fq '不下载、不安装、不运行' service-page.html
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 'https://life.aivora.cn/rss.xml' --output rss.xml
          grep -Fq '/posts/pyaging-public-data-reproduction-guide/' rss.xml
          grep -Fq '/posts/pyaging-vs-scageclock-input-choice/' rss.xml
          grep -Fq '/posts/scageclock-public-sample-reproduction-guide/' rss.xml
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 "$scageclock_page" --output scageclock-page.html
          grep -Fq '单细胞时钟示例' scageclock-page.html
          grep -Fq '36552059091' scageclock-page.html
          grep -Fq '不是独立测试集' scageclock-page.html
          grep -Fq '下载中文演示视频 MP4' scageclock-page.html
          grep -Fq 'scageclock-public-video-v1' scageclock-page.html
          grep -Fq '/posts/pyaging-vs-scageclock-input-choice/' scageclock-page.html
          grep -Fq '/posts/scageclock-public-sample-reproduction-guide/' scageclock-page.html
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 "$biolearn_page" --output biolearn-page.html
          grep -Fq 'Biolearn 公开 NHANES 数据试跑' biolearn-page.html
          grep -Fq '36555722121' biolearn-page.html
          grep -Fq '2,877' biolearn-page.html
          grep -Fq '42.61' biolearn-page.html
          grep -Fq 'NOASSERTION' biolearn-page.html
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 "$tools_page" --output tools-page.html
          grep -Fq 'AI 延寿研究开源工具导航' tools-page.html
          grep -Fq 'gangcai/scageclock' tools-page.html
          grep -Fq 'bio-learn/biolearn' tools-page.html
          grep -Fq '/projects/scageclock-public-demo' tools-page.html
          grep -Fq '尚未试跑' tools-page.html
          grep -Fq '/services/repo-preflight/' tools-page.html
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 "$stats_page" --output stats-page.html
          grep -Fq '流量统计说明' stats-page.html
          grep -Fq '51.LA' stats-page.html
          grep -Fq 'LA-DATA-WIDGET' stats-page.html
          grep -Fq '文章级访问与来源报表还没有公开分享链接' stats-page.html
          code="$(curl --silent --show-error --location --head --connect-timeout 10 --max-time 25 --output /dev/null --write-out '%{http_code}' "$video")"
          test "$code" = '200'
          scageclock_code="$(curl --silent --show-error --location --head --connect-timeout 10 --max-time 25 --output /dev/null --write-out '%{http_code}' "$scageclock_video")"
          test "$scageclock_code" = '200'
          echo "Both tested project pages, the useful guide and RSS, the curated directory, and both legacy public videos are reachable. Video HEAD HTTP $code / $scageclock_code." >> "$GITHUB_STEP_SUMMARY"
      - name: Explain a failed website check without changing publication status
        if: failure()
        run: echo 'Public project page or video could not be independently reached from GitHub runner; inspect DNS, HTTPS and Pages. A successful deployment receipt alone is insufficient.' >> "$GITHUB_STEP_SUMMARY"
