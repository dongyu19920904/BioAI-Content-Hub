name: Public-data Biolearn project demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-public-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_NO_CACHE_DIR: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test private-row exclusion and result validation
        run: python -m unittest discover -s automation/projects -p 'test_biolearn_public_demo.py'
      - name: Fetch the reviewed Biolearn release tag
        run: |
          git clone --depth=1 --branch v0.9.1 https://github.com/bio-learn/biolearn.git upstream-biolearn
          test "$(git -C upstream-biolearn rev-parse HEAD)" = 2bc00d55bac6eac2f95600e4d118103942a98277
      - name: Install pinned upstream research software
        run: python -m pip install ./upstream-biolearn
      - name: Run the upstream public NHANES example
        run: python automation/projects/biolearn_public_demo.py
      - name: Check aggregate-only artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('automation/runs/biolearn-public-demo/summary.json').read_text(encoding='utf-8'))
          assert result['sample_rows_after_upstream_filtering'] > 0
          assert result['valid_model_outputs'] > 0
          assert isinstance(result['median_model_output'], (int, float))
          assert len(result) == 8
          assert not {'id', 'participant_id', 'person_id', 'rows', 'predictions'} & result.keys()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: biolearn-public-summary-${{ github.run_id }}
          path: automation/runs/biolearn-public-demo/summary.json
          retention-days: 7
